name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/tv-time.apk

      - name: Upload APK (download from the run's Summary page)
        uses: actions/upload-artifact@v4
        with:
          name: tv-time-apk
          path: out/tv-time.apk

      # On the main branch, also publish to a "latest" release so the TV can download it
      # directly by URL (e.g. with the Downloader app):
      # https://github.com/<owner>/<repo>/releases/latest/download/tv-time.apk
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TV Time (latest build)
          body: "Automatic build of ${{ github.sha }}. Install tv-time.apk on your Android TV / phone."
          files: out/tv-time.apk
          make_latest: true

  pi:
    # Checks the Raspberry Pi parts: the extension must be rebuilt from the shared sources
    # (python3 pi/build-extension.py) whenever web/ or the Android assets change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extension is up to date with the shared sources
        run: |
          python3 pi/build-extension.py
          git diff --exit-code -- pi/extension || (echo "::error::Run 'python3 pi/build-extension.py' and commit the result" && exit 1)
      - name: Syntax checks
        run: |
          for f in web/start/start.js web/shield/youtube.js pi/extension/*.js app/src/main/assets/inject.js; do node --check "$f"; done
          python3 -m py_compile pi/tvremote.py pi/build-extension.py
          bash -n pi/install.sh pi/launch.sh pi/cec-setup.sh
          python3 -c "import json; json.load(open('pi/extension/manifest.json')); json.load(open('pi/extension/rules/ads.json'))"
      - name: Package the Pi extension
        run: cd pi && zip -qr ../tv-time-pi-extension.zip extension
      - uses: actions/upload-artifact@v4
        with:
          name: tv-time-pi-extension
          path: tv-time-pi-extension.zip

  emulator-test:
    # Installs the APK on an Android emulator and drives it with remote-control keys only,
    # taking a screenshot after every step (download "emulator-test-results" from the run).
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tv-time-apk
          path: out
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app like a TV remote would
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-test.sh
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: test-out
