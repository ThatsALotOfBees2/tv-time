<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Time</title>
  <link rel="stylesheet" href="start.css">
  <link rel="stylesheet" href="intro.css">
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <header class="top">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="5" y="13" width="38" height="27" rx="5" fill="none" stroke="currentColor" stroke-width="3.5"/>
        <path d="M17 5l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 20v13l11-6.5z" fill="currentColor"/>
      </svg>
      <span>TV Time</span>
    </div>
    <div class="clock">
      <div id="time" class="time">--:--</div>
      <div id="date" class="date"></div>
    </div>
  </header>

  <main>
    <h1 id="greeting" class="greeting">Welcome</h1>

    <section aria-label="Watch">
      <div id="main-tiles" class="row row-main"></div>
    </section>

    <section aria-label="Your sites">
      <h2 class="row-title">Your sites</h2>
      <div id="custom-tiles" class="row row-small"></div>
    </section>
  </main>

  <footer class="bottom">
    <div class="shield">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3.5v6c0 5-3.4 9.3-8 10.5C7.4 20.8 4 16.5 4 11.5v-6z" fill="currentColor"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#0b0c10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Ad blocker on
    </div>
    <div id="hints" class="hints"></div>
  </footer>

  <!-- Add / manage sites -->
  <div id="dialog" class="dialog" hidden>
    <div class="dialog-box" role="dialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title">Add a site</h2>
      <label>Name<input id="f-name" data-nav type="text" placeholder="e.g. Netflix" autocomplete="off"></label>
      <label>Address<input id="f-url" data-nav type="url" placeholder="e.g. netflix.com" autocomplete="off" inputmode="url"></label>
      <p id="f-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button id="f-save" data-nav class="btn btn-primary" type="button">Add</button>
        <button id="f-cancel" data-nav class="btn" type="button">Cancel</button>
      </div>
      <div id="manage" class="manage"></div>
      <div class="manage">
        <h3>Startup intro</h3>
        <div class="dialog-actions">
          <button id="intro-toggle" data-nav class="btn" type="button">Intro: on</button>
          <button id="intro-play" data-nav class="btn" type="button">Play it now</button>
        </div>
      </div>
    </div>
  </div>

  <script src="start.js"></script>
  <script src="intro-sound-timing.js"></script>
  <script src="intro.js"></script>
</body>
</html>
